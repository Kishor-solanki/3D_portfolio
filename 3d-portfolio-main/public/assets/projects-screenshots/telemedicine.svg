<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="120" fill="#22d3ee" opacity="0.05"/>
  <circle cx="100" cy="450" r="100" fill="#3b82f6" opacity="0.05"/>

  <!-- Top header -->
  <rect x="0" y="0" width="800" height="60" fill="#0f172a" opacity="0.9"/>
  <rect x="0" y="58" width="800" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#accent)"/>
    <path d="M16 8 L16 24 M8 16 L24 16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">TeleMed</text>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">AI-Integrated Telemedicine</text>

  <!-- Status pill -->
  <g transform="translate(600, 18)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#22d3ee" opacity="0.15"/>
    <circle cx="16" cy="14" r="5" fill="#22d3ee"/>
    <text x="28" y="18" font-family="Arial, sans-serif" font-size="11" fill="#22d3ee">AI Consultation</text>
  </g>

  <!-- Main video consultation card -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="460" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <!-- Video area -->
    <rect x="55" y="95" width="430" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="270" cy="170" r="30" fill="#22d3ee" opacity="0.2"/>
    <circle cx="270" cy="170" r="20" fill="#22d3ee" opacity="0.3"/>
    <path d="M260 160 L260 180 M280 160 L280 180" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <text x="270" y="220" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Video Consultation</text>
    
    <!-- Video controls -->
    <g transform="translate(100, 260)">
      <rect x="0" y="0" width="40" height="40" rx="20" fill="#334155"/>
      <path d="M15 12 L25 20 L15 28 Z" fill="#fff"/>
    </g>
    <g transform="translate(150, 260)">
      <rect x="0" y="0" width="40" height="40" rx="20" fill="#ef4444"/>
      <line x1="14" y1="14" x2="26" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="14" x2="14" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(200, 260)">
      <rect x="0" y="0" width="40" height="40" rx="20" fill="#334155"/>
      <path d="M12 20 L28 20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- AI assistant card -->
  <g filter="url(#shadow)">
    <rect x="520" y="80" width="240" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="540" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">AI Health Assistant</text>
    
    <!-- Chat bubbles -->
    <g transform="translate(540, 130)">
      <rect x="0" y="0" width="180" height="35" rx="8" fill="#334155"/>
      <text x="10" y="22" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">How can I help you today?</text>
    </g>
    <g transform="translate(540, 180)">
      <rect x="0" y="0" width="150" height="35" rx="8" fill="#22d3ee" opacity="0.2"/>
      <text x="10" y="22" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">I have a fever...</text>
    </g>
    <g transform="translate(540, 230)">
      <rect x="0" y="0" width="200" height="50" rx="8" fill="#334155"/>
      <text x="10" y="18" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0">Based on your symptoms,</text>
      <text x="10" y="35" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">I recommend a doctor visit.</text>
    </g>
  </g>

  <!-- Bottom stats row -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Doctors Online</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">24/7</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">Available Now</text>
  </g>
  <g transform="translate(280, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">AI Diagnosis</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">98%</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">Accuracy Rate</text>
  </g>
  <g transform="translate(520, 360)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Patients Helped</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">10,000+</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">Happy Patients</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="520" width="800" height="13" fill="url(#accent)" opacity="0.8"/>
</svg>