<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bg)"/>

  <!-- Decorative pattern -->
  <g opacity="0.05">
    <circle cx="100" cy="100" r="80" fill="#22c55e"/>
    <circle cx="700" cy="450" r="100" fill="#10b981"/>
    <circle cx="650" cy="100" r="60" fill="#22c55e"/>
  </g>

  <!-- Top header -->
  <rect x="0" y="0" width="800" height="60" fill="#0f172a" opacity="0.9"/>
  <rect x="0" y="58" width="800" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#accent)"/>
    <path d="M16 8 L16 24 M8 16 L24 16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Delhi Medicines</text>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Healthcare Connectivity Platform</text>

  <!-- Status pill -->
  <g transform="translate(620, 18)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#22c55e" opacity="0.15"/>
    <circle cx="16" cy="14" r="5" fill="#22c55e"/>
    <text x="28" y="18" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">● Connected</text>
  </g>

  <!-- Main dashboard card -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="460" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Healthcare Network</text>
    <text x="60" y="130" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Connecting patients, doctors & providers</text>

    <!-- Network nodes -->
    <g transform="translate(60, 160)">
      <circle cx="30" cy="30" r="25" fill="#22c55e" opacity="0.2"/>
      <circle cx="30" cy="30" r="15" fill="#22c55e"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">P</text>
      <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Patients</text>
    </g>
    <g transform="translate(180, 160)">
      <circle cx="30" cy="30" r="25" fill="#3b82f6" opacity="0.2"/>
      <circle cx="30" cy="30" r="15" fill="#3b82f6"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">D</text>
      <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Doctors</text>
    </g>
    <g transform="translate(300, 160)">
      <circle cx="30" cy="30" r="25" fill="#f59e0b" opacity="0.2"/>
      <circle cx="30" cy="30" r="15" fill="#f59e0b"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">M</text>
      <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Medicines</text>
    </g>
    <g transform="translate(420, 160)">
      <circle cx="30" cy="30" r="25" fill="#8b5cf6" opacity="0.2"/>
      <circle cx="30" cy="30" r="15" fill="#8b5cf6"/>
      <text x="30" y="34" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">G</text>
      <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Govt</text>
    </g>

    <!-- Connection lines -->
    <line x1="90" y1="190" x2="210" y2="190" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
    <line x1="210" y1="190" x2="330" y2="190" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <line x1="330" y1="190" x2="450" y2="190" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

    <!-- Stats -->
    <g transform="translate(60, 260)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Active Users</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">5,000+</text>
    </g>
    <g transform="translate(200, 260)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Medicines</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">2,500+</text>
    </g>
    <g transform="translate(340, 260)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Doctors</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">500+</text>
    </g>
  </g>

  <!-- AI features card -->
  <g filter="url(#shadow)">
    <rect x="520" y="80" width="240" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="540" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">AI Features</text>
    
    <g transform="translate(540, 130)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#334155"/>
      <text x="10" y="16" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">● Medicine Info</text>
      <text x="10" y="32" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">AI-powered drug information</text>
    </g>
    <g transform="translate(540, 185)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#334155"/>
      <text x="10" y="16" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">● Health Tips</text>
      <text x="10" y="32" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Personalized health advice</text>
    </g>
    <g transform="translate(540, 240)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#334155"/>
      <text x="10" y="16" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">● Connectivity</text>
      <text x="10" y="32" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Stakeholder communication</text>
    </g>
  </g>

  <!-- Bottom stats row -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Database</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Secure</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Data Protected</text>
  </g>
  <g transform="translate(280, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Platform</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Web</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Responsive UI</text>
  </g>
  <g transform="translate(520, 360)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">AI Integration</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Enabled</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Smart Features</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="520" width="800" height="13" fill="url(#accent)" opacity="0.8"/>
</svg>