<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="mapLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="533"/>
    <line x1="200" y1="0" x2="200" y2="533"/>
    <line x1="300" y1="0" x2="300" y2="533"/>
    <line x1="400" y1="0" x2="400" y2="533"/>
    <line x1="500" y1="0" x2="500" y2="533"/>
    <line x1="600" y1="0" x2="600" y2="533"/>
    <line x1="700" y1="0" x2="700" y2="533"/>
  </g>

  <!-- Map route lines -->
  <path d="M80 400 Q 200 350, 300 380 T 500 320 T 700 360" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8,4"/>
  <path d="M80 400 Q 200 350, 300 380 T 500 320 T 700 360" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Route stations -->
  <circle cx="80" cy="400" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="300" cy="380" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="500" cy="320" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="700" cy="360" r="5" fill="#38bdf8" opacity="0.6"/>

  <!-- Moving train indicator -->
  <g filter="url(#glow)">
    <circle cx="400" cy="350" r="8" fill="#ff6b6b"/>
    <circle cx="400" cy="350" r="4" fill="#fff"/>
  </g>

  <!-- Top header bar -->
  <rect x="0" y="0" width="800" height="60" fill="#0f172a" opacity="0.9"/>
  <rect x="0" y="58" width="800" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#accent)"/>
    <path d="M8 22 L16 8 L24 22" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="26" x2="26" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">RailGaadi</text>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Real-Time Train Tracking</text>

  <!-- Status pill -->
  <g transform="translate(620, 18)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#22c55e" opacity="0.15"/>
    <circle cx="16" cy="14" r="5" fill="#22c55e"/>
    <text x="28" y="18" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">● Live Tracking</text>
  </g>

  <!-- Main dashboard card -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="460" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Train #12951 - Mumbai Rajdhani</text>
    <text x="60" y="130" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Delhi → Mumbai Central</text>

    <!-- Progress bar -->
    <rect x="60" y="150" width="420" height="6" rx="3" fill="#334155"/>
    <rect x="60" y="150" width="280" height="6" rx="3" fill="url(#accent)"/>
    <circle cx="340" cy="153" r="7" fill="#ff6b6b" stroke="#fff" stroke-width="2"/>

    <!-- Stats -->
    <g transform="translate(60, 180)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">ETA</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">14:32</text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">On Time</text>
    </g>
    <g transform="translate(180, 180)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Speed</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">92 km/h</text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" fill="#38bdf8">▲ 5 km/h</text>
    </g>
    <g transform="translate(300, 180)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Delay</text>
      <text y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">0 min</text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Perfect</text>
    </g>
  </g>

  <!-- Weather card -->
  <g filter="url(#shadow)">
    <rect x="520" y="80" width="240" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="540" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Weather</text>
    <g transform="translate(540, 130)">
      <circle cx="20" cy="20" r="18" fill="#fbbf24" opacity="0.2"/>
      <circle cx="20" cy="20" r="10" fill="#fbbf24"/>
      <text x="50" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff">28°C</text>
      <text x="50" y="45" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Clear Sky</text>
    </g>
    <g transform="translate(540, 200)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Humidity</text>
      <text y="18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">54%</text>
    </g>
    <g transform="translate(650, 200)">
      <text font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Wind</text>
      <text y="18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">12 km/h</text>
    </g>
  </g>

  <!-- Bottom stats row -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Journey Analytics</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">1,384 km</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#38bdf8">Total Distance</text>
  </g>
  <g transform="translate(280, 310)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Stations</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">12 Stops</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#f97316">Next: Kota Jn</text>
  </g>
  <g transform="translate(520, 310)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Geospatial Context</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">MapTiler</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#38bdf8">MapLibre GL</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="520" width="800" height="13" fill="url(#accent)" opacity="0.8"/>
</svg>