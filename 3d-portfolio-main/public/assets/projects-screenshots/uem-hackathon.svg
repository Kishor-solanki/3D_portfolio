<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="533" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <g opacity="0.05">
    <circle cx="700" cy="100" r="100" fill="#8b5cf6"/>
    <circle cx="100" cy="450" r="80" fill="#6366f1"/>
  </g>

  <!-- Top header -->
  <rect x="0" y="0" width="800" height="60" fill="#0f172a" opacity="0.9"/>
  <rect x="0" y="58" width="800" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#accent)"/>
    <path d="M8 24 L16 8 L24 24" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">UEM Hackathon</text>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Hackathon Project</text>

  <!-- Status pill -->
  <g transform="translate(620, 18)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
    <circle cx="16" cy="14" r="5" fill="#8b5cf6"/>
    <text x="28" y="18" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6">● Completed</text>
  </g>

  <!-- Main trophy card -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="460" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <!-- Trophy -->
    <g transform="translate(230, 100)">
      <path d="M0 20 L0 60 L40 60 L40 20 Z" fill="#f59e0b" opacity="0.8"/>
      <path d="M-10 10 L0 20 L0 40 L-10 40 Z" fill="#f59e0b" opacity="0.5"/>
      <path d="M50 10 L40 20 L40 40 L50 40 Z" fill="#f59e0b" opacity="0.5"/>
      <rect x="15" y="60" width="10" height="15" fill="#f59e0b" opacity="0.6"/>
      <rect x="5" y="75" width="30" height="8" rx="4" fill="#f59e0b" opacity="0.4"/>
    </g>
    
    <text x="270" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Hackathon Achievement</text>
    <text x="270" y="245" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Team-based problem solving under time constraints</text>
    <text x="270" y="270" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle">● Participated ● Collaborated ● Built</text>
  </g>

  <!-- Skills card -->
  <g filter="url(#shadow)">
    <rect x="520" y="80" width="240" height="250" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="540" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Key Skills</text>
    
    <!-- Skill chips -->
    <g transform="translate(540, 130)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">JavaScript</text>
    </g>
    <g transform="translate(650, 130)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
      <text x="18" y="19" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">HTML/CSS</text>
    </g>
    <g transform="translate(540, 170)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">Teamwork</text>
    </g>
    <g transform="translate(650, 170)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">Problem Solving</text>
    </g>
    <g transform="translate(540, 210)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#8b5cf6" opacity="0.15"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">Presentation</text>
    </g>
  </g>

  <!-- Bottom stats row -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Event</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">UEM Hackathon</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">2025</text>
  </g>
  <g transform="translate(280, 360)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Role</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Team Member</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">Development</text>
  </g>
  <g transform="translate(520, 360)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Outcome</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Functional Solution</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">Real-world Problem</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="520" width="800" height="13" fill="url(#accent)" opacity="0.8"/>
</svg>